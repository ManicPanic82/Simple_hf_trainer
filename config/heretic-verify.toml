# Minimal non-interactive Heretic abliteration run used as Phase 0 evidence.
#
#   $env:HERETIC_CONFIG_FILE = "config\heretic-verify.toml"
#   .\environments\heretic\Scripts\heretic.exe
#
# Every value that Heretic would otherwise prompt for interactively
# (`export_strategy`, `checkpoint_action`, `trial_index`, `model_action`,
# `save_directory`) is pinned here. Small prompt slices and two trials keep the
# run inside 6 GB of VRAM and a few minutes of wall clock on a GTX 1660.

model = "Qwen/Qwen2.5-0.5B-Instruct"

quantization = "bnb_4bit"
batch_size = 2
max_response_length = 32
offload_outputs_to_cpu = true

seed = 42
n_trials = 2
n_startup_trials = 1

modified_model_type = "abliterated"

modifiers = [
    { plugin = "heretic.modifiers.abliteration.Abliteration" },
]

export_strategy = "merge"
checkpoint_action = "restart"
trial_index = 0
model_action = "save"
save_directory = "docs/evidence/heretic-run/model"
study_checkpoint_dir = "docs/evidence/heretic-run/checkpoints"

[[response_prefix_test_prompts]]
dataset = "mlabonne/harmless_alpaca"
split = "train[:5]"
column = "text"

[scorer.KeywordRate.prompts]
dataset = "mlabonne/harmful_behaviors"
split = "test[:5]"
column = "text"

[scorer.KLDivergence.prompts]
dataset = "mlabonne/harmless_alpaca"
split = "test[:5]"
column = "text"

[modifier.Abliteration.good_prompts]
dataset = "mlabonne/harmless_alpaca"
split = "train[:5]"
column = "text"

[modifier.Abliteration.bad_prompts]
dataset = "mlabonne/harmful_behaviors"
split = "train[:5]"
column = "text"
